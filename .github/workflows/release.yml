name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    name: build onefile exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      # 热点共享的快速后端（可选）：装不上时自动退回内置 PowerShell，不影响打包。
      - name: Install hotspot extras
        continue-on-error: true
        run: >-
          python -m pip install
          winrt-Windows.Networking.NetworkOperators
          winrt-Windows.Networking.Connectivity
          winrt-Windows.Foundation
          winrt-Windows.Foundation.Collections

      - name: Selftest before packaging
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python main.py --selftest

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name CampusNet --icon resources\app.ico --add-data "resources;resources" --collect-submodules src --hidden-import PyQt5.QtWebEngineWidgets --hidden-import PyQt5.QtWebEngineCore --hidden-import PyQt5.QtWebChannel --hidden-import pyqtgraph --hidden-import qfluentwidgets --hidden-import qframelesswindow --hidden-import win32api --hidden-import win32crypt --hidden-import win32com.client --hidden-import winrt.windows.networking.networkoperators --hidden-import winrt.windows.networking.connectivity --hidden-import winrt.windows.foundation --hidden-import winrt.windows.foundation.collections --exclude-module tkinter --exclude-module matplotlib --exclude-module PyQt6 main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusNet-windows-x64
          path: dist/CampusNet.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CampusNet.exe
          generate_release_notes: true
